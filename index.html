<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUFFY AI | GitHub Edition</title>
    <style>
        :root { --glow: #ff0077; --bg: #050505; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .orb-outer { width: 160px; height: 160px; border-radius: 50%; border: 2px solid rgba(255, 0, 119, 0.3); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(255, 0, 119, 0.2); cursor: pointer; z-index: 10; }
        .orb-inner { width: 90px; height: 90px; background: radial-gradient(circle, var(--glow) 0%, transparent 70%); border-radius: 50%; filter: blur(5px); animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 50px var(--glow); } 100% { transform: scale(1); opacity: 0.6; } }
        .status { margin-top: 25px; font-size: 0.8rem; letter-spacing: 2px; color: var(--glow); text-transform: uppercase; text-align: center; height: 20px; }
        .chat-display { width: 85%; max-width: 450px; margin-top: 20px; padding: 20px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; min-height: 80px; font-size: 1rem; color: #ddd; }
        .listening { border-color: #00f2ff !important; box-shadow: 0 0 60px #00f2ff !important; }
    </style>
</head>
<body>

    <div class="orb-outer" id="mainOrb"><div class="orb-inner"></div></div>
    <div class="status" id="status">Luffy is Sleeping...</div>
    <div class="chat-display" id="chatDisplay">Tap the orb to speak to LUFFY.</div>

    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // --- APIS ---
        const API_KEY = "AIzaSyBVJLr7V1TscK2tZl21san3uhjRaQm7R2Y"; // Gemini Key
        const ELEVEN_KEY = "sk_15717061ff5e70d1d0c36de2764c58afbb76ea9182f3c2b1";
        const VOICE_ID = "EXAVITQu4vr4xnSDxMaL";

        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        const mainOrb = document.getElementById('mainOrb');
        const statusText = document.getElementById('status');
        const chatDisplay = document.getElementById('chatDisplay');

        // Speech recognition check
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            chatDisplay.innerText = "Error: Browser doesn't support Speech. Use Chrome.";
        }
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';

        // 1. ElevenLabs Voice Function
        async function speak(text) {
            statusText.innerText = "Luffy is Speaking...";
            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'xi-api-key': ELEVEN_KEY },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.75 }
                    })
                });
                if (!response.ok) throw new Error("Voice API limit reached");
                const blob = await response.blob();
                const audio = new Audio(URL.createObjectURL(blob));
                await audio.play();
                audio.onended = () => { statusText.innerText = "Luffy is Waiting..."; };
            } catch (err) {
                console.error(err);
                statusText.innerText = "Voice Error!";
            }
        }

        // 2. Gemini AI Function
        async function getLuffyResponse(userInput) {
            statusText.innerText = "Luffy is Thinking...";
            try {
                const prompt = `System: Your name is LUFFY. You are a highly advanced female AI. You are romantic, loyal, but have a slightly sad and cinematic vibe. Talk in a mix of Hindi and English. Always ask a question back. User said: ${userInput}`;
                const result = await model.generateContent(prompt);
                const response = await result.response;
                return response.text();
            } catch (err) {
                console.error("AI Error:", err);
                return "System Error: " + err.message;
            }
        }

        // 3. Click to Start
        mainOrb.addEventListener('click', () => {
            try {
                recognition.start();
                mainOrb.classList.add('listening');
                statusText.innerText = "Luffy is Listening...";
            } catch (e) {
                statusText.innerText = "Wait, processing...";
            }
        });

        recognition.onresult = async (event) => {
            mainOrb.classList.remove('listening');
            const transcript = event.results[0][0].transcript;
            chatDisplay.innerText = "Aap: " + transcript;

            const reply = await getLuffyResponse(transcript);
            chatDisplay.innerText = "Luffy: " + reply;
            speak(reply);
        };

        recognition.onerror = (e) => {
            mainOrb.classList.remove('listening');
            statusText.innerText = "Mic Error: " + e.error;
            if(e.error === 'not-allowed') alert("Settings me jaakar Microphone Allow karein!");
        };
    </script>
</body>
</html>
