<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUFFY | AI Assistant</title>
    <style>
        :root { --glow: #ff0077; --bg: #050505; }
        body { background-color: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .orb-outer { width: 180px; height: 180px; border-radius: 50%; border: 2px solid rgba(255, 0, 119, 0.3); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px rgba(255, 0, 119, 0.2); transition: 0.5s; cursor: pointer; }
        .orb-inner { width: 100px; height: 100px; background: radial-gradient(circle, var(--glow) 0%, transparent 70%); border-radius: 50%; filter: blur(5px); animation: pulse 1.5s infinite ease-in-out; }
        @keyframes pulse { 0% { transform: scale(1); opacity: 0.6; } 50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 50px var(--glow); } 100% { transform: scale(1); opacity: 0.6; } }
        .status { margin-top: 30px; font-size: 0.9rem; letter-spacing: 3px; color: var(--glow); text-transform: uppercase; text-align: center; }
        .chat-display { width: 85%; max-width: 500px; margin-top: 20px; padding: 20px; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); text-align: center; max-height: 200px; overflow-y: auto; font-size: 1.1rem; }
        .listening { border-color: #00f2ff !important; box-shadow: 0 0 60px #00f2ff !important; }
    </style>
</head>
<body>

    <div class="orb-outer" id="mainOrb"><div class="orb-inner"></div></div>
    <div class="status" id="status">Luffy is Sleeping...</div>
    <div class="chat-display" id="chatDisplay">Tap the orb to speak to LUFFY.</div>

    <script type="importmap">
      { "imports": { "@google/generative-ai": "https://esm.run/@google/generative-ai" } }
    </script>

    <script type="module">
        import { GoogleGenerativeAI } from "@google/generative-ai";

        // --- KEYS ---
        const GEMINI_KEY = "AIzaSyBVJLr7V1TscK2tZl21san3uhjRaQm7R2Y";
        const ELEVENLABS_KEY = "sk_15717061ff5e70d1d0c36de2764c58afbb76ea9182f3c2b1";
        const VOICE_ID = "EXAVITQu4vr4xnSDxMaL";

        const genAI = new GoogleGenerativeAI(GEMINI_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        const mainOrb = document.getElementById('mainOrb');
        const statusText = document.getElementById('status');
        const chatDisplay = document.getElementById('chatDisplay');

        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'hi-IN';

        async function speak(text) {
            statusText.innerText = "Luffy is Speaking...";
            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'xi-api-key': ELEVENLABS_KEY },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.8 }
                    })
                });
                const blob = await response.blob();
                const audio = new Audio(URL.createObjectURL(blob));
                audio.play();
                audio.onended = () => { statusText.innerText = "Luffy is Waiting..."; };
            } catch (err) { statusText.innerText = "Voice Error!"; }
        }

        async function getLuffyResponse(userInput) {
            statusText.innerText = "Luffy is Thinking...";
            try {
                const prompt = `Your name is LUFFY. You are a female AI. You are deeply romantic, sometimes sad, and very loyal. Talk in a mix of Hindi and English. Be like a movie assistant. End with a question. User said: ${userInput}`;
                const result = await model.generateContent(prompt);
                return result.response.text();
            } catch (err) {
                console.error(err);
                return "Maaf kijiye, connection me kuch dikkat hai.";
            }
        }

        mainOrb.addEventListener('click', () => {
            recognition.start();
            mainOrb.classList.add('listening');
            statusText.innerText = "Luffy is Listening...";
        });

        recognition.onresult = async (event) => {
            mainOrb.classList.remove('listening');
            const transcript = event.results[0][0].transcript;
            chatDisplay.innerText = "Aap: " + transcript;
            const reply = await getLuffyResponse(transcript);
            chatDisplay.innerText = "Luffy: " + reply;
            speak(reply);
        };

        recognition.onerror = () => {
            mainOrb.classList.remove('listening');
            statusText.innerText = "Error! Try Again.";
        };
    </script>
</body>
</html>
