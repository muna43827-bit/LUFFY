<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUFFY | AI Assistant</title>
    <style>
        :root {
            --glow: #ff0077;
            --bg: #050505;
        }

        body {
            background-color: var(--bg);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Avengers Style Arc Reactor Orb */
        .orb-outer {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 2px solid rgba(255, 0, 119, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 30px rgba(255, 0, 119, 0.2);
            transition: 0.5s;
            cursor: pointer;
        }

        .orb-inner {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--glow) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(5px);
            animation: pulse 1.5s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 50px var(--glow); }
            100% { transform: scale(1); opacity: 0.6; }
        }

        .status {
            margin-top: 30px;
            font-size: 0.9rem;
            letter-spacing: 3px;
            color: var(--glow);
            text-transform: uppercase;
        }

        .chat-display {
            width: 85%;
            max-width: 500px;
            margin-top: 20px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-height: 200px;
            overflow-y: auto;
            font-size: 1.1rem;
        }

        .listening {
            border-color: #00f2ff !important;
            box-shadow: 0 0 60px #00f2ff !important;
        }
    </style>
</head>
<body>

    <div class="orb-outer" id="mainOrb">
        <div class="orb-inner"></div>
    </div>

    <div class="status" id="status">Luffy is Sleeping...</div>

    <div class="chat-display" id="chatDisplay">
        Tap the orb to speak to LUFFY.
    </div>

    <script>
        // --- CONFIGURATION ---
        const GROQ_API_KEY = "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";
        const ELEVENLABS_KEY = "sk_15717061ff5e70d1d0c36de2764c58afbb76ea9182f3c2b1";
        const VOICE_ID = "EXAVITQu4vr4xnSDxMaL"; // Female Voice

        const mainOrb = document.getElementById('mainOrb');
        const statusText = document.getElementById('status');
        const chatDisplay = document.getElementById('chatDisplay');

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'hi-IN';
        recognition.continuous = false;
        recognition.interimResults = false;

        // --- FUNCTIONS ---

        // 1. Voice Logic
        async function speak(text) {
            statusText.innerText = "Luffy is Speaking...";
            try {
                const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'xi-api-key': ELEVENLABS_KEY
                    },
                    body: JSON.stringify({
                        text: text,
                        model_id: "eleven_multilingual_v2",
                        voice_settings: { stability: 0.5, similarity_boost: 0.8 }
                    })
                });
                const blob = await response.blob();
                const audio = new Audio(URL.createObjectURL(blob));
                audio.play();
                audio.onended = () => {
                    statusText.innerText = "Luffy is Waiting...";
                };
            } catch (err) {
                console.error("Voice Error:", err);
                statusText.innerText = "Voice Error!";
            }
        }

        // 2. AI Brain Logic
        async function getLuffyResponse(userInput) {
            statusText.innerText = "Luffy is Thinking...";
            try {
                const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${GROQ_API_KEY}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "llama3-70b-8192",
                        messages: [
                            { 
                                role: "system", 
                                content: "Your name is LUFFY. You are a female AI. You are deeply romantic, sometimes sad, and very loyal. You talk like a cinematic assistant in Hindi-English mix. Always ask the user a touching follow-up question." 
                            },
                            { role: "user", content: userInput }
                        ]
                    })
                });
                const data = await response.json();
                return data.choices[0].message.content;
            } catch (err) {
                return "Maaf kijiye, system me koi dikkat aa gayi hai.";
            }
        }

        // --- INTERACTION ---

        mainOrb.addEventListener('click', () => {
            try {
                recognition.start();
                mainOrb.classList.add('listening');
                statusText.innerText = "Luffy is Listening...";
            } catch (e) {
                console.log("Mic already active or error:", e);
            }
        });

        recognition.onresult = async (event) => {
            mainOrb.classList.remove('listening');
            const transcript = event.results[0][0].transcript;
            chatDisplay.innerText = "Aap: " + transcript;

            const luffyReply = await getLuffyResponse(transcript);
            chatDisplay.innerText = "Luffy: " + luffyReply;
            speak(luffyReply);
        };

        recognition.onspeechend = () => {
            recognition.stop();
            mainOrb.classList.remove('listening');
        };

        recognition.onerror = (event) => {
            mainOrb.classList.remove('listening');
            if (event.error === 'not-allowed') {
                statusText.innerText = "Mic Permission Needed!";
                alert("Please allow microphone access in your browser settings.");
            } else {
                statusText.innerText = "Try Again: " + event.error;
            }
        };

    </script>
</body>
</html>
