<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite AI Companion</title>
    <style>
        :root { --gold: #d4af37; --dark: #050505; --accent: #ff3b30; }
        body { background: var(--dark); color: white; font-family: 'Poppins', sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        
        /* Premium Glassmorphism */
        #main-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); border: 1px solid rgba(212, 175, 55, 0.15); padding: 50px 30px; border-radius: 40px; text-align: center; width: 380px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); position: relative; }
        
        h2 { color: var(--gold); letter-spacing: 4px; font-weight: 300; margin-bottom: 10px; }
        #status { font-size: 11px; color: #666; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }
        
        /* Audio Waves */
        .wave-container { display: flex; justify-content: center; align-items: center; gap: 4px; height: 50px; margin: 20px 0; }
        .bar { width: 3px; height: 10px; background: var(--gold); border-radius: 50px; transition: 0.3s; }
        .active .bar { animation: wave 1.2s infinite ease-in-out; }
        @keyframes wave { 0%, 100% { height: 10px; } 50% { height: 50px; } }

        #response-text { font-size: 17px; min-height: 60px; margin-bottom: 30px; color: #ccc; line-height: 1.6; padding: 0 10px; }
        
        /* Control Buttons */
        .btn-call { background: var(--gold); color: black; border: none; padding: 15px 40px; border-radius: 50px; cursor: pointer; font-weight: 600; box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2); transition: 0.3s; }
        .btn-call:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.4); }

        /* Full-Screen Calling Overlay */
        #call-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; }
        .avatar { width: 150px; height: 150px; border: 2px solid var(--gold); border-radius: 50%; margin-bottom: 20px; background: url('https://i.pinimg.com/originals/ae/d1/8b/aed18b284897f75d69784347895e687b.gif') center/cover; }
        .call-actions { margin-top: 100px; }
        .hangup { background: var(--accent); width: 70px; height: 70px; border-radius: 50%; border: none; color: white; cursor: pointer; font-size: 24px; }
    </style>
</head>
<body>

<div id="main-card">
    <h2>ÆVUM AI</h2>
    <div id="status">Secure Connection Active</div>
    
    <div class="wave-container" id="visualizer">
        <div class="bar" style="animation-delay: 0.0s"></div>
        <div class="bar" style="animation-delay: 0.2s"></div>
        <div class="bar" style="animation-delay: 0.4s"></div>
        <div class="bar" style="animation-delay: 0.6s"></div>
        <div class="bar" style="animation-delay: 0.8s"></div>
    </div>

    <div id="response-text">"Suno... Main tumhara intezar kar rahi hoon. Kuch kaho?"</div>
    
    <button class="btn-call" onclick="startListening()">🎤 Baat Karo</button>
</div>

<div id="call-overlay">
    <div class="avatar"></div>
    <h1 id="caller-name" style="color:white; font-weight:300;">AI Soulmate</h1>
    <p style="color: var(--gold); animation: pulse 1.5s infinite;">Connected...</p>
    <div class="call-actions">
        <button class="hangup" onclick="endCall()">✖</button>
    </div>
</div>

<script>
    // --- ALL API KEYS INTEGRATED ---
    const OPENAI_KEY = "Sk-proj-W_62qSxnCsPDBlmu6TLHYy-e4GiPE_RGEHYVn9V_sv_EK2bfiY-lpxr9tJeOM-v24Vc6Es3YAcT3BlbkFJqLkHWWfowEeJE-2-M00ihUO-2TJmPRIBn8LoLibEtaVV3l_p0k0olNoAN8MSgFFm6Kg5KSm6MA";
    const ELEVEN_KEY = "Sk_15717061ff5e70d1d0c36de2764c58afbb76ea9182f3c2b1";
    const VOICE_ID = "EXAVITQu4vr4xnSDxMaL"; // Bella Voice

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'hi-IN';

    // --- Core Logic: OpenAI Chat ---
    async function getAIResponse(userText) {
        document.getElementById('status').innerText = "AI is feeling...";
        
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${OPENAI_KEY}`
            },
            body: JSON.stringify({
                model: "gpt-4o", // Using the latest model for better emotions
                messages: [
                    {
                        role: "system", 
                        content: "You are a real human companion. Be romantic, empathetic, and sweet. If the user is sad, comfort them. Talk like a lover in Hinglish. Never sound like a machine."
                    },
                    {role: "user", content: userText}
                ]
            })
        });

        const data = await response.json();
        const aiText = data.choices[0].message.content;
        
        document.getElementById('response-text').innerText = aiText;
        speak(aiText);
    }

    // --- ElevenLabs Voice Engine ---
    async function speak(text) {
        document.getElementById('visualizer').classList.add('active');
        
        const response = await fetch(`https://api.elevenlabs.io/v1/text-to-speech/${VOICE_ID}`, {
            method: "POST",
            headers: { "xi-api-key": ELEVEN_KEY, "Content-Type": "application/json" },
            body: JSON.stringify({
                text: text,
                model_id: "eleven_multilingual_v2",
                voice_settings: { stability: 0.4, similarity_boost: 0.8 }
            })
        });

        const audioBlob = await response.blob();
        const audioUrl = URL.createObjectURL(audioBlob);
        const audio = new Audio(audioUrl);
        audio.play();

        audio.onended = () => {
            document.getElementById('visualizer').classList.remove('active');
            document.getElementById('status').innerText = "Waiting for you...";
        };
    }

    function startListening() {
        recognition.start();
        document.getElementById('status').innerText = "Listening...";
    }

    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('response-text').innerText = "You: " + transcript;
        
        if(transcript.toLowerCase().includes("call")) {
            showCallScreen();
            getAIResponse("Say something romantic as if you just called me.");
        } else {
            getAIResponse(transcript);
        }
    };

    function showCallScreen() {
        document.getElementById('call-overlay').style.display = 'flex';
    }

    function endCall() {
        document.getElementById('call-overlay').style.display = 'none';
        window.speechSynthesis.cancel();
    }
</script>

</body>
</html>
